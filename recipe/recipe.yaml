schema_version: 1

context:
  version: "0.2.56"

package:
  name: rumdl
  version: ${{ version }}

source:
  url: https://github.com/rvben/rumdl/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9eb4097c53022bde7281ba6d1b4242f591f0e56b1169b3cde16e9ae121c09d18

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    interpreter: brush
    content:
      - cargo auditable install --locked --no-track --bins --root "${LIBRARY_PREFIX:-$PREFIX}" --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - cargo-auditable
    - cargo-bundle-licenses
    - brush
    - if: unix
      then: make

tests:
  - script:
      - rumdl --help
      - rumdl --version
  - package_contents:
      bin:
        - rumdl
      strict: true

about:
  homepage: https://github.com/rvben/rumdl
  summary: A fast Markdown linter written in Rust
  description: |
    rumdl is a fast Markdown linter with rule compatibility inspired by
    markdownlint.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://rumdl.dev
  repository: https://github.com/rvben/rumdl

extra:
  recipe-maintainers:
    - baszalmstra
